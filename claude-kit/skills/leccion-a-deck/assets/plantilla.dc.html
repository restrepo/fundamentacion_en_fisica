/* Color de un token del sistema, resuelto en tiempo de ejecución: las figuras
   que se dibujan por JS siguen al tema si se retocan los tokens. */
function tok(nombre) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(nombre).trim();
  return v || '#201e1d';
}

/* Módulos de la lección (núcleo adaptado a deck-stage + interactividad propia).
   Se ejecutan una sola vez, cuando la plantilla ya está en el DOM. */
function initLeccion() {
%%JS%%
}

class Component extends DCLogic {
  componentDidMount() {
    const arranca = () => {
      const dsListo = getComputedStyle(document.documentElement).getPropertyValue('--color-accent').trim();
      if (!document.querySelector('section.diapositiva') || (!dsListo && (this.__esperas = (this.__esperas || 0) + 1) < 100)) { setTimeout(arranca, 50); return; }
      if (!window.__leccionLista) {
        window.__leccionLista = true;
        try { initLeccion(); } catch (e) { console.error('initLeccion', e); }
      }
      if (window.__leccionTypeset) window.__leccionTypeset();
    };
    arranca();
  }
  renderVals() { return {}; }
}
</script>
